[project]
name = "bearing-fault-detection"
version = "2.0.0"
description = "Physics-Informed AI Bearing Fault Detection & Digital Twin Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[tool.vercel]
entrypoint = "backend.main:app"